<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Analytics & Enablement Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative customer analytics and enablement portfolio covering campaign performance, targeting, data assurance, experimentation and decision support.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;
  --border:#d8e0e5;--border-2:#bcc8cf;--ink:#18232c;--ink-2:#55636f;--ink-3:#7b8893;
  --accent:#0b5d6b;--accent-2:#2f7f7a;--accent-dim:#e4f1f2;--accent-mid:#bddcde;
  --blue:#4a7897;--blue-dim:#e7eff5;--gold:#b58b48;--ok:#3f7a4c;--ok-dim:#e8f3eb;
  --warn:#a3720a;--warn-dim:#fbf1dc;--risk:#a23b2e;--risk-dim:#f8e8e5;
  --shadow:0 7px 22px rgba(34,48,58,.08);--shadow-sm:0 2px 8px rgba(34,48,58,.06);
  --radius:11px;--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono','Courier New',monospace;
}
:root[data-theme="dark"]{
  --paper:#11171c;--surface:#182027;--surface-alt:#1e2830;--surface-deep:#25313a;
  --border:#2f3b44;--border-2:#43525e;--ink:#edf2f4;--ink-2:#aab5be;--ink-3:#81909b;
  --accent:#61c5bf;--accent-2:#7cd4cf;--accent-dim:#173335;--accent-mid:#27585a;
  --blue:#7ba9c8;--blue-dim:#1b3040;--gold:#c9a86d;--ok:#7fc98f;--ok-dim:#193425;
  --warn:#e0ad4c;--warn-dim:#3a2e15;--risk:#e08a7a;--risk-dim:#3c201d;
  --shadow:0 9px 26px rgba(0,0,0,.27);--shadow-sm:0 2px 10px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body,.card,.header,.sidebar,.nav,.select,.theme-btn,.scenario,.heat-cell{transition:background-color .18s,color .18s,border-color .18s}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button,select{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.header{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:10px;align-items:center;min-width:240px}.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative;box-shadow:var(--shadow-sm)}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.brand-mark:before{top:11px}.brand-mark:after{top:20px}
.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.select,.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}
.theme-btn{display:flex;align-items:center;gap:7px;font-weight:600}.theme-orb{width:10px;height:10px;border-radius:50%;background:#e0a72f;box-shadow:0 0 0 4px rgba(224,167,47,.14)}
:root[data-theme="dark"] .theme-orb{background:#8bc5ec;box-shadow:0 0 0 4px rgba(139,197,236,.12)}
.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}
.side-title{font:400 .5rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:0 9px 8px}
.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}
.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}
.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}
.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink-2)}
.main{min-width:0;padding:20px 24px 44px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}
.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:850px;color:var(--ink-2);font-size:.69rem;line-height:1.45}
.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}
.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}
.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.kpi{display:flex;justify-content:space-between;gap:7px}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}
.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:500 .54rem/1 var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.good{color:var(--ok);background:var(--ok-dim)}.warn{color:var(--warn);background:var(--warn-dim)}.bad{color:var(--risk);background:var(--risk-dim)}
.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--ink-2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}
.chart{width:100%;height:205px;display:block;overflow:visible}.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--ink-3);font:8px var(--mono)}
.line-a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tooltip{position:fixed;z-index:1000;pointer-events:none;min-width:150px;max-width:260px;padding:8px 9px;border-radius:7px;background:var(--ink);color:var(--surface);font-size:.57rem;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none}.tooltip strong{display:block;margin-bottom:3px;font-size:.6rem}
.hoverable{cursor:help}.metric-stack{display:grid;gap:8px}.metric-bar{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center}.metric-bar label{font-size:.59rem;color:var(--ink-2)}
.track{height:7px;border-radius:999px;background:var(--surface-deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}
.heatmap{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .48rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center}
.heat-label{font-size:.59rem;color:var(--ink-2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}
.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl.warn .tl-dot{border-color:var(--warn)}.tl.bad .tl-dot{border-color:var(--risk)}.tl.good .tl-dot{border-color:var(--ok)}
.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}
.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}
.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}
.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:8px;text-align:left;font-size:.58rem}
.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}
.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}
@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.header{align-items:flex-start;flex-wrap:wrap}}
@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenarios{grid-template-columns:1fr}.header{position:static}}
</style>
</head>
<body>
<div class="shell">
<header class="header">
  <div class="brand"><div class="brand-mark"></div><div><h1>Khaled S. - Customer Analytics & Enablement Portfolio</h1><p>campaign analytics · targeting · experimentation · decision support</p></div></div>
  <div class="controls">
    <select class="select" id="period"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select>
    <select class="select" id="scope"><option>Portfolio view</option><option>Priority segment</option><option>Exception view</option></select>
    <button class="theme-btn" id="themeBtn"><span class="theme-orb"></span><span id="themeText">Dark</span></button>
  </div>
</header>
<div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
const CFG={
  views:[
    {nav:"Executive overview",title:"Customer communications overview",desc:"A decision-oriented view connecting audience quality, engagement, conversion, cost and recommended actions."},
    {nav:"Performance",title:"Campaign and segment performance",desc:"Comparative performance across customer segments, channels and communication strategies."},
    {nav:"Data assurance",title:"Data and analytical assurance",desc:"Controls supporting reliable campaign analysis, defensible recommendations and reusable analytics."},
    {nav:"Scenarios",title:"Targeting scenarios",desc:"Scenario testing for audience strategy, contact frequency and conversion response."},
    {nav:"Governance",title:"Governance and lineage",desc:"Traceable analytical logic from source data through metric definition to business decision."}
  ],
  kpis:[
    {label:"Eligible audience",value:"1.24m",sub:"+6.8% vs prior cycle",icon:"AU"},
    {label:"Engagement rate",value:"42.7%",sub:"+4.1 pp",icon:"EN"},
    {label:"Conversion rate",value:"8.9%",sub:"+1.3 pp",icon:"CV"},
    {label:"Cost / conversion",value:"$14.20",sub:"-11.6%",icon:"CP"}
  ],
  seriesLabels:["Baseline","Current"],lineLabel:"Opt-out signal",
  primaryChartTitle:"Segment response and communication pressure",
  primaryChartSub:"Response movement by segment with opt-out signal overlay.",
  primaryRows:[
    {label:"High value",a:72,b:84,line:3},{label:"Digital",a:68,b:78,line:4},{label:"Low freq",a:54,b:62,line:2},
    {label:"At risk",a:43,b:48,line:7},{label:"Dormant",a:24,b:31,line:5},{label:"New to bank",a:49,b:57,line:3}
  ],
  healthTitle:"Enablement health",healthSub:"Selected controls and analytical readiness measures.",
  health:[
    {label:"Audience quality",value:94},{label:"Data completeness",value:91},{label:"Metric consistency",value:96},{label:"Experiment design",value:88},{label:"Action closure",value:84}
  ],
  register:[
    ["Segment B allocation","Targeting","On track","Increase audience share"],
    ["Segment D frequency","Contact strategy","Review","Reduce frequency and retest"],
    ["Message C evidence","Experimentation","Watch","Run controlled test"],
    ["Dormant audience","Value case","Review","Reassess treatment threshold"]
  ],
  trendA:[33,35,37,36,39,41,42,44,43,46,47,49],trendB:[6.1,6.4,6.8,6.7,7.1,7.4,7.8,8.0,8.1,8.5,8.7,8.9],
  mix:[
    {label:"High-value active",value:82},{label:"Digital engaged",value:74},{label:"Low-frequency",value:58},{label:"At-risk attrition",value:39},{label:"Dormant",value:21}
  ],
  performanceRows:[
    ["Email","Engagement rate","46.2%","+3.8 pp","On track"],
    ["In-app","Conversion rate","10.6%","+1.9 pp","On track"],
    ["SMS","Cost per conversion","$18.40","-6.2%","Review"],
    ["High-value","Incremental response","13.8%","+2.4 pp","On track"],
    ["Dormant","Incremental response","3.1%","Flat","Watch"]
  ],
  quality:[
    {label:"Customer attributes",values:[98,96,94,97]},
    {label:"Campaign exposures",values:[96,95,92,94]},
    {label:"Response events",values:[94,93,91,95]},
    {label:"Cost / value inputs",values:[91,92,86,90]}
  ],
  flow:[
    {title:"Business question",text:"Define objective, population, decision and success measure."},
    {title:"Data",text:"Customer, communication, response and value sources."},
    {title:"Validation",text:"Reconcile populations, definitions, exclusions and data quality."},
    {title:"Analysis",text:"Segmentation, trend, scenario and statistical testing."},
    {title:"Recommendation",text:"Action, expected impact, caveats and next test."}
  ],
  scenarios:[
    {name:"Base",note:"Current audience and contact settings.",series:[34,36,38,40,41,43,45,47],kpis:[["Audience","1.24m","Current"],["Engagement","42.7%","Current"],["Conversion","8.9%","Current"],["Opt-out","1.8%","Current"]],decision:"Maintain current portfolio with targeted refinements",detail:"Performance is positive overall, but segment-level frequency and value thresholds should remain under review."},
    {name:"Target uplift",note:"Shift volume toward high-response segments.",series:[34,38,42,47,51,55,58,61],kpis:[["Audience","1.16m","More selective"],["Engagement","47.9%","Higher"],["Conversion","10.8%","Higher"],["Opt-out","1.6%","Lower"]],decision:"Increase allocation to stronger segments",detail:"A more selective audience improves efficiency while preserving scale. Retain control groups to confirm incremental value."},
    {name:"Frequency cut",note:"Reduce repeat contacts for fatigue-sensitive segments.",series:[34,35,37,39,42,45,47,50],kpis:[["Audience","1.21m","Near current"],["Engagement","44.8%","Higher"],["Conversion","9.5%","Higher"],["Opt-out","1.2%","Lower"]],decision:"Reduce frequency where fatigue signals are material",detail:"Lower contact intensity can improve response quality and reduce opt-out risk without materially reducing eligible reach."},
    {name:"Test expansion",note:"Broaden experimentation across messages and channels.",series:[34,37,39,43,46,50,54,59],kpis:[["Tests","18","Expanded"],["Engagement","45.6%","Higher"],["Conversion","10.1%","Higher"],["Confidence","88%","Improved"]],decision:"Expand controlled experimentation",detail:"Use standardised test design and decision thresholds so learning can be reused across campaigns and channels."}
  ],
  lineage:[
    {title:"Decision",text:"Target, refine, test, proceed or stop."},
    {title:"Measure",text:"Audience, engagement, conversion, cost and incremental value."},
    {title:"Logic",text:"SQL/Python transformations, segmentation and statistical tests."},
    {title:"Source",text:"Customer, campaign, interaction and value data."},
    {title:"QA",text:"Reconciliation, assumptions, exclusions and review evidence."}
  ],
  timeline:[
    {cls:"good",title:"Pre-campaign validation",text:"Audience counts, suppression rules and metric definitions checked."},
    {cls:"good",title:"In-flight monitoring",text:"Response, delivery and exception signals reviewed during execution."},
    {cls:"warn",title:"Decision gate",text:"Material changes require evidence, caveats and expected-value assessment."},
    {cls:"good",title:"Post-campaign learning",text:"Results, assumptions and reusable insights captured for the next cycle."}
  ]
};
let state={view:0,scenario:0};
function statusClass(s){return /on track|healthy|complete|strong/i.test(s)?"good":/watch|review|conditional|medium/i.test(s)?"warn":"bad"}
function badge(s){return `<span class="badge ${statusClass(s)}">${s}</span>`}
function smoothPath(points){if(points.length<2)return"";let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const p0=points[i],p1=points[i+1],mx=(p0[0]+p1[0])/2;d+=` C ${mx} ${p0[1]}, ${mx} ${p1[1]}, ${p1[0]} ${p1[1]}`;}return d}
function bindTooltips(){const tip=document.getElementById("tooltip");document.querySelectorAll("[data-tip]").forEach(el=>{el.addEventListener("mouseenter",()=>{tip.innerHTML=el.dataset.tip;tip.style.display="block"});el.addEventListener("mousemove",e=>{const r=tip.getBoundingClientRect(),pad=12,gap=14;let l=e.clientX+gap,t=e.clientY+gap;if(l+r.width+pad>innerWidth)l=e.clientX-r.width-gap;if(t+r.height+pad>innerHeight)t=e.clientY-r.height-gap;tip.style.left=Math.max(pad,l)+"px";tip.style.top=Math.max(pad,t)+"px"});el.addEventListener("mouseleave",()=>tip.style.display="none")})}
function lineChart(series,second=null){const w=650,h=220,p=28,all=[...series,...(second||[])],min=Math.min(...all)-2,max=Math.max(...all)+2,pts=series.map((v,i)=>[p+i/(series.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),pts2=second?second.map((v,i)=>[p+i/(second.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]):[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join("")}<path class="line-a" d="${smoothPath(pts)}"/>${second?`<path class="line-b" d="${smoothPath(pts2)}"/>`:""}${pts.map((q,i)=>`<circle class="hoverable" data-tip="<strong>Period ${i+1}</strong>Primary ${series[i]}" cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join("")}</svg>`}
function barLine(rows){const w=650,h=220,pL=42,pR=24,pT=18,pB=28,slot=(w-pL-pR)/rows.length,maxB=Math.max(...rows.map(x=>Math.max(x.a,x.b)))*1.12,maxL=Math.max(...rows.map(x=>x.line),1)*1.15,bars=rows.map((d,i)=>{const x=pL+i*slot+slot*.14,ah=d.a/maxB*(h-pT-pB),bh=d.b/maxB*(h-pT-pB);return `<rect class="hoverable" data-tip="<strong>${d.label}</strong>${CFG.seriesLabels[0]} ${d.a}<br>${CFG.seriesLabels[1]} ${d.b}<br>${CFG.lineLabel} ${d.line}" x="${x}" y="${h-pB-ah}" width="${slot*.25}" height="${ah}" rx="3" fill="var(--blue)" opacity=".78"/><rect class="hoverable" data-tip="<strong>${d.label}</strong>${CFG.seriesLabels[1]} ${d.b}" x="${x+slot*.29}" y="${h-pB-bh}" width="${slot*.25}" height="${bh}" rx="3" fill="var(--gold)" opacity=".86"/>`}).join(""),pts=rows.map((d,i)=>[pL+i*slot+slot*.42,pT+(maxL-d.line)/maxL*(h-pT-pB)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join("")}${bars}<path class="line-risk" d="${smoothPath(pts)}"/>${rows.map((d,i)=>`<text class="tick" x="${pL+i*slot+slot*.12}" y="${h-8}">${d.label}</text>`).join("")}</svg>`}
function metricBars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x.label}</label><div class="track"><div class="fill" style="width:${x.value}%"></div></div><div class="metric-score">${x.value}%</div></div>`).join("")}</div>`}
function renderOverview(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[0].title}</h2><p class="page-desc">${CFG.views[0].desc}</p></div><span class="demo">Illustrative demonstration</span></div>
<section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub}</div></div><div class="kpi-icon">${x.icon}</div></div></div>`).join("")}</section>
<section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>${CFG.primaryChartTitle}</h3><p>${CFG.primaryChartSub}</p></div><div class="legend"><span><i style="background:var(--blue)"></i>${CFG.seriesLabels[0]}</span><span><i style="background:var(--gold)"></i>${CFG.seriesLabels[1]}</span><span><i style="background:var(--risk)"></i>${CFG.lineLabel}</span></div></div>${barLine(CFG.primaryRows)}</div><div class="card"><div class="chart-title"><div><h3>${CFG.healthTitle}</h3><p>${CFG.healthSub}</p></div></div>${metricBars(CFG.health)}</div></section>
<section class="grid two"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Prioritise audience quality and incremental value over raw campaign volume</h3><p>Use transparent targeting and testing logic so communication effort is concentrated where customer response, commercial value and confidence in the evidence intersect.</p></div><div class="card"><div class="chart-title"><div><h3>Priority register</h3><p>Current items requiring action or confirmation.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div></div></section>`}
function renderPerformance(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[1].title}</h2><p class="page-desc">${CFG.views[1].desc}</p></div><span class="demo">Performance view</span></div>
<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Engagement and conversion trend</h3><p>Illustrative movement across 12 reporting periods.</p></div></div>${lineChart(CFG.trendA,CFG.trendB)}</div><div class="card"><div class="chart-title"><div><h3>Segment performance index</h3><p>Relative response across major customer groups.</p></div></div>${metricBars(CFG.mix)}</div></section>
<section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Performance scorecard</h3><p>Selected measures and current position.</p></div></div><div class="table-wrap"><table><thead><tr><th>Channel / segment</th><th>Primary measure</th><th>Current</th><th>Direction</th><th>Status</th></tr></thead><tbody>${CFG.performanceRows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===4?badge(v):v}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`}
function renderQuality(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[2].title}</h2><p class="page-desc">${CFG.views[2].desc}</p></div><span class="demo">Assurance view</span></div>
<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heatmap"><div></div>${["Complete","Accurate","Timely","Controlled"].map(x=>`<div class="heat-head">${x}</div>`).join("")}${CFG.quality.map(q=>`<div class="heat-label">${q.label}</div>${q.values.map(v=>`<div class="heat-cell ${v>=93?"hi":v>=88?"mid":"lo"}">${v}</div>`).join("")}`).join("")}</div></div>
<div class="card"><div class="chart-title"><div><h3>Validation pathway</h3><p>From business question to a decision-ready recommendation.</p></div></div><div class="flow">${CFG.flow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':""}<div class="node ${i===0?"active":""}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join("")}</div></div></section>
<section class="grid two" style="margin-top:10px"><div class="card"><div class="chart-title"><div><h3>Issue ageing</h3><p>Open analytical or data issues by age.</p></div></div>${metricBars([{label:"0–7 days",value:82},{label:"8–30 days",value:46},{label:"31–90 days",value:19},{label:">90 days",value:6}])}</div><div class="decision"><div class="eyebrow">Assurance principle</div><h3>Every recommendation should remain traceable to population, logic, assumptions and evidence</h3><p>Reliable enablement products make exclusions, definitions, confidence and data limitations visible so stakeholders can understand not only the result, but why it is decision-ready.</p></div></section>`}
function renderScenario(){const s=CFG.scenarios[state.scenario];return `<div class="page-head"><div><h2 class="page-title">${CFG.views[3].title}</h2><p class="page-desc">${CFG.views[3].desc}</p></div><span class="demo">Scenario view</span></div>
<div class="scenarios">${CFG.scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?"active":""}" data-sc="${i}"><strong>${x.name}</strong><span>${x.note}</span></button>`).join("")}</div>
<section class="grid kpis">${s.kpis.map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">${x[2]}</div></div>`).join("")}</section>
<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Scenario response trajectory</h3><p>Baseline compared with selected scenario.</p></div></div>${lineChart(CFG.scenarios[0].series,s.series)}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s.decision}</h3><p>${s.detail}</p></div></section>`}
function renderGovernance(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[4].title}</h2><p class="page-desc">${CFG.views[4].desc}</p></div><span class="demo">Governance view</span></div>
<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Measure lineage</h3><p>Trace recommendations back to controlled logic and source data.</p></div></div><div class="flow">${CFG.lineage.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':""}<div class="node ${i===0?"active":""}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join("")}</div></div>
<div class="card"><div class="chart-title"><div><h3>Governance rhythm</h3><p>Control and review points across the analytical lifecycle.</p></div></div><div class="timeline">${CFG.timeline.map(x=>`<div class="tl ${x.cls}"><span class="tl-dot"></span><strong>${x.title}</strong><p>${x.text}</p></div>`).join("")}</div></div></section>
<section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Governance controls</h3><p>Ownership, evidence and current status.</p></div></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Purpose</th><th>Evidence</th><th>Status</th></tr></thead><tbody>
<tr><td>Audience validation</td><td>Confirm eligible and excluded populations</td><td>Reconciliation and suppression checks</td><td>${badge("On track")}</td></tr>
<tr><td>Metric definition</td><td>Keep campaign measures consistent</td><td>Controlled calculation catalogue</td><td>${badge("On track")}</td></tr>
<tr><td>Experiment QA</td><td>Protect test validity</td><td>Design and decision thresholds</td><td>${badge("Review")}</td></tr>
<tr><td>Recommendation log</td><td>Retain decisions and assumptions</td><td>Action and evidence register</td><td>${badge("On track")}</td></tr>
</tbody></table></div></section>`}
const RENDERERS=[renderOverview,renderPerformance,renderQuality,renderScenario,renderGovernance];
function renderSidebar(){const s=document.getElementById("sidebar");s.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?"active":""}" data-view="${i}"><span class="nav-num">0${i+1}</span><span class="nav-label">${v.nav}</span></button>`).join("")}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Designed for role-relevant decision support</div>`;s.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{state.view=+b.dataset.view;render()}))}
function render(){document.getElementById("main").innerHTML=RENDERERS[state.view]();renderSidebar();bindTooltips();document.querySelectorAll("[data-sc]").forEach(b=>b.addEventListener("click",()=>{state.scenario=+b.dataset.sc;render()}))}
document.getElementById("themeBtn").addEventListener("click",()=>{const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";document.getElementById("themeText").textContent=dark?"Dark":"Light"});
render();
</script>
</body></html>
