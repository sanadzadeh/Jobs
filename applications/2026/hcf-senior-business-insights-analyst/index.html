<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Insights & Member Analytics Portfolio</title><style>
:root{--paper:#f3f5f6;--surface:#fff;--surface2:#f7f9fa;--border:#d8e0e5;--ink:#18232c;--muted:#64727d;--accent:#0b5d6b;--accent2:#4a7897;--accentdim:#e4f1f2;--ok:#3f7a4c;--warn:#a3720a;--risk:#a23b2e;--shadow:0 7px 22px rgba(34,48,58,.08);--serif:Georgia,serif;--mono:'Courier New',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand h1{font:600 1.15rem var(--serif);margin:0}.brand p{font:.52rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}.theme{border:1px solid var(--border);background:var(--surface2);padding:7px 10px;border-radius:7px}.app{display:grid;grid-template-columns:215px 1fr}.side{position:sticky;top:58px;height:calc(100vh - 58px);background:var(--surface);border-right:1px solid var(--border);padding:14px 10px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-left:3px solid transparent;border-radius:7px;margin:2px 0;color:var(--muted);font-weight:600}.nav.active{background:var(--accentdim);border-left-color:var(--accent);color:var(--accent)}.meta{font:.57rem/1.5 var(--mono);color:var(--muted);border-top:1px solid var(--border);margin-top:18px;padding:12px 8px}.main{padding:20px 24px 40px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:14px}.head h2{font:600 1.45rem var(--serif);margin:0 0 5px}.head p{font-size:.7rem;color:var(--muted);margin:0;max-width:850px}.pill{font:.5rem var(--mono);text-transform:uppercase;background:var(--accentdim);color:var(--accent);padding:5px 8px;border-radius:99px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px;box-shadow:0 2px 8px rgba(34,48,58,.05)}.eyebrow{font:.49rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.value{font:600 1.38rem var(--serif)}.sub{font-size:.58rem;color:var(--muted);margin-top:4px}.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:130px 1fr 42px;gap:8px;align-items:center}.bar span:first-child{font-size:.59rem;color:var(--muted)}.track{height:7px;background:#e9eef1;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.score{font:.55rem var(--mono);text-align:right;color:var(--muted)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:150px;flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px}.node strong{font:.51rem var(--mono);text-transform:uppercase;color:var(--muted)}.node p{font-size:.58rem;line-height:1.4;color:var(--muted);margin:5px 0 0}.arrow{align-self:center;color:var(--muted)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface2));border-radius:11px;padding:13px}.decision h3{font:600 .95rem var(--serif);margin:0 0 5px}.decision p{font-size:.6rem;line-height:1.5;color:var(--muted);margin:0}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:720px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:.59rem}th{font:.47rem var(--mono);text-transform:uppercase;color:var(--muted);background:var(--surface2)}.badge{padding:3px 6px;border-radius:99px;font-size:.55rem;font-weight:700}.good{background:#e8f3eb;color:var(--ok)}.warn{background:#fbf1dc;color:var(--warn)}.risk{background:#f8e8e5;color:var(--risk)}.scens{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.sc{border:1px solid var(--border);background:var(--surface2);border-radius:7px;padding:9px;text-align:left;font-size:.58rem;color:var(--muted)}.sc.active{background:var(--accentdim);border-color:var(--accent);color:var(--accent)}.sc strong{display:block}.sc span{display:block;font-size:.51rem;margin-top:3px}.heat{display:grid;grid-template-columns:145px repeat(4,1fr);gap:6px;align-items:center}.hh{font:.47rem var(--mono);text-transform:uppercase;color:var(--muted);text-align:center}.hl{font-size:.59rem;color:var(--muted)}.hc{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.52rem var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.meta{display:none}.nav{white-space:nowrap;width:auto}.kpis,.two,.scens{grid-template-columns:1fr}.main{padding:16px 12px 30px}.header{position:static}}
</style></head><body><header class="header"><div class="brand"><h1>Khaled S. - Business Insights & Member Analytics</h1><p>membership · performance · forecasting · data quality · decision support</p></div><button class="theme" id="theme">Dark mode</button></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><script>
const views=[['Executive overview','Member & business performance overview','A decision-oriented view of membership, utilisation, revenue, forecast movement and current analytical priorities.'],['Insight workflow','Insight workflow','From stakeholder question through exploratory analysis, validation, interpretation and recommendation.'],['Data assurance','Data quality & asset assurance','Testing, reconciliation and issue-resolution controls supporting reliable analytical products.'],['Scenarios','Forecast & performance scenarios','How changes in member behaviour, utilisation, revenue or cost drivers affect the outlook.'],['Governance','Reporting & analytics governance','A practical control framework for repeatable reporting, data products and stakeholder use.']];let state={v:0,s:0};const scens=[['Base','Current trends continue.','Maintain current forecast','Current indicators remain within tolerance, with focus on retention and utilisation drivers.'],['Retention pressure','Member exits rise above plan.','Test revenue and cohort impacts','Separate acquisition, lapse and tenure effects before recommending intervention.'],['Claims growth','Benefits utilisation rises faster than plan.','Analyse mix and driver changes','Break movement into volume, service mix and cohort effects and refresh forecast assumptions.'],['Data issue','Key source produces unexpected movement.','Gate affected insight and investigate','Trace source-to-output logic, reconcile the exception and restore confidence before reuse.']];
function head(i){return `<div class="head"><div><h2>${views[i][1]}</h2><p>${views[i][2]}</p></div><span class="pill">Illustrative data only</span></div>`}function bars(){let a=[['Membership signal',93],['Forecast confidence',90],['Data completeness',96],['KPI consistency',92],['Automation coverage',88]];return `<div class="bars">${a.map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}function flow(a){return `<div class="flow">${a.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div>`}function overview(){return head(0)+`<div class="grid kpis"><div class="card"><div class="eyebrow">Member base</div><div class="value">2.01m</div><div class="sub">Illustrative portfolio</div></div><div class="card"><div class="eyebrow">12m retention</div><div class="value">91.8%</div><div class="sub">Current cohort view</div></div><div class="card"><div class="eyebrow">Revenue variance</div><div class="value">+1.6%</div><div class="sub">Against forecast</div></div><div class="card"><div class="eyebrow">Open insights</div><div class="value">7</div><div class="sub">Priority questions</div></div></div><div class="grid two"><div class="card">${bars()}</div><div class="decision"><div class="eyebrow">Decision focus</div><h3>Connect member behaviour to commercial outcomes</h3><p>Use cohort, claims, revenue and performance analysis to show which movements are structural, which are temporary and where intervention is likely to change the outcome.</p></div></div>`}function workflow(){return head(1)+`<div class="card" style="margin-bottom:10px">${flow([['Question','Clarify decision, users and required outcome.'],['Explore','Profile data, segments, trends and anomalies.'],['Validate','Reconcile sources, definitions and edge cases.'],['Interpret','Identify material drivers and business implications.'],['Recommend','Communicate action, confidence and monitoring.']])}</div><div class="grid two"><div class="card">${bars()}</div><div class="decision"><div class="eyebrow">Analytical principle</div><h3>Answer the business question, not just the data request</h3><p>Strong insight combines technical analysis with context, clear assumptions and a recommendation that stakeholders can use.</p></div></div>`}function assurance(){return head(2)+`<div class="grid two"><div class="card"><div class="heat"><div></div>${['Complete','Accurate','Timely','Consistent'].map(x=>`<div class="hh">${x}</div>`).join('')}<div class="hl">Membership</div><div class="hc hi">97</div><div class="hc hi">95</div><div class="hc hi">94</div><div class="hc hi">96</div><div class="hl">Claims</div><div class="hc hi">95</div><div class="hc mid">91</div><div class="hc hi">94</div><div class="hc mid">90</div><div class="hl">Revenue</div><div class="hc hi">98</div><div class="hc hi">96</div><div class="hc mid">92</div><div class="hc hi">95</div><div class="hl">Reference</div><div class="hc hi">99</div><div class="hc hi">98</div><div class="hc hi">97</div><div class="hc hi">99</div></div></div><div class="card">${flow([['Detect','Automated checks or stakeholder exception.'],['Trace','Follow source, transform and measure logic.'],['Reconcile','Compare against trusted reference or prior period.'],['Resolve','Correct data, rule or process issue.'],['Evidence','Document validation and closure.']])}</div></div>`}function scenarios(){let s=scens[state.s];return head(3)+`<div class="scens">${scens.map((x,i)=>`<button class="sc ${i===state.s?'active':''}" data-s="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><div class="grid two"><div class="card">${bars()}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s[2]}</h3><p>${s[3]}</p></div></div>`}function gov(){return head(4)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Asset</th><th>Control</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Membership KPI</td><td>Certified definition + reconciliation</td><td><span class="badge good">Controlled</span></td><td>Monthly review</td></tr><tr><td>Claims extract</td><td>Completeness + duplicate checks</td><td><span class="badge good">On track</span></td><td>Maintain automated tests</td></tr><tr><td>Forecast model</td><td>Assumption log + sensitivity tests</td><td><span class="badge warn">Review</span></td><td>Refresh driver assumptions</td></tr><tr><td>Ad hoc analysis</td><td>Peer validation + source notes</td><td><span class="badge good">Controlled</span></td><td>Retain reproducible logic</td></tr></tbody></table></div></div>`}const R=[overview,workflow,assurance,scenarios,gov];function render(){document.getElementById('main').innerHTML=R[state.v]();document.getElementById('side').innerHTML=views.map((x,i)=>`<button class="nav ${i===state.v?'active':''}" data-v="${i}">${x[0]}</button>`).join('')+`<div class="meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Role-relevant analytics demonstration</div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{state.v=+b.dataset.v;render()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state.s=+b.dataset.s;render()})}document.getElementById('theme').onclick=()=>{document.body.style.filter=document.body.style.filter?'':'invert(.9) hue-rotate(180deg)'};render();
</script></body></html>
