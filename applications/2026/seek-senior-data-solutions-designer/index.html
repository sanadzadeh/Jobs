<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Solutions Design Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative data solutions design portfolio covering requirements translation, modelling, data quality, lineage and delivery governance.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;--border:#d8e0e5;--ink:#18232c;--ink-2:#55636f;--ink-3:#7b8893;--accent:#0b5d6b;--accent-dim:#e4f1f2;--accent-mid:#bddcde;--blue:#4a7897;--gold:#b58b48;--ok:#3f7a4c;--ok-dim:#e8f3eb;--warn:#a3720a;--warn-dim:#fbf1dc;--risk:#a23b2e;--risk-dim:#f8e8e5;--shadow:0 7px 22px rgba(34,48,58,.08);--shadow-sm:0 2px 8px rgba(34,48,58,.06);--radius:11px;--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono','Courier New',monospace}
:root[data-theme="dark"]{--paper:#11171c;--surface:#182027;--surface-alt:#1e2830;--surface-deep:#25313a;--border:#2f3b44;--ink:#edf2f4;--ink-2:#aab5be;--ink-3:#81909b;--accent:#61c5bf;--accent-dim:#173335;--accent-mid:#27585a;--blue:#7ba9c8;--gold:#c9a86d;--ok:#7fc98f;--ok-dim:#193425;--warn:#e0ad4c;--warn-dim:#3a2e15;--risk:#e08a7a;--risk-dim:#3c201d;--shadow:0 9px 26px rgba(0,0,0,.27);--shadow-sm:0 2px 10px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}button{font:inherit;cursor:pointer}.shell{min-height:100vh}.header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center}.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative;box-shadow:var(--shadow-sm)}.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.brand-mark:before{top:11px}.brand-mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:.64rem;font-weight:600}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}.side-title{font:400 .5rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink-2)}.main{padding:20px 24px 44px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:860px;color:var(--ink-2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}.chart{width:100%;height:205px;display:block}.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--ink-3);font:8px var(--mono)}.metric-stack{display:grid;gap:8px}.metric-bar{display:grid;grid-template-columns:120px 1fr 42px;gap:8px;align-items:center}.metric-bar label{font-size:.59rem;color:var(--ink-2)}.track{height:7px;border-radius:999px;background:var(--surface-deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:160px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}.heatmap{display:grid;grid-template-columns:145px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .48rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center}.heat-label{font-size:.59rem;color:var(--ink-2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl.warn .tl-dot{border-color:var(--warn)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:8px;text-align:left;font-size:.58rem}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.good{color:var(--ok);background:var(--ok-dim)}.warn-b{color:var(--warn);background:var(--warn-dim)}
@media(max-width:1000px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.two,.kpis,.scenarios{grid-template-columns:1fr}.main{padding:16px 12px 36px}.header{position:static}}
</style>
</head>
<body>
<div class="shell"><header class="header"><div class="brand"><div class="brand-mark"></div><div><h1>Khaled S. - Data Solutions Design Portfolio</h1><p>requirements · modelling · quality · lineage · delivery</p></div></div><button class="theme-btn" id="themeBtn">Dark mode</button></header><div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div></div>
<script>
const views=[
['Executive overview','Data solution overview','A business-facing view of how a complex requirement is translated into a governed, scalable data product.'],
['Solution design','Solution design','Logical model, source interfaces, transformations and design trade-offs.'],
['Data assurance','Data assurance','Quality controls, anomaly investigation, reconciliation and root-cause pathways.'],
['Delivery scenarios','Delivery scenarios','Alternative design paths under changing scale, quality and latency constraints.'],
['Governance','Governance and lineage','Traceability from business outcome to metric, transformation and controlled source.']];
let state={view:0,scenario:0};
const kpis=[['Source domains','7','Integrated into target design'],['Critical measures','18','Defined and traceable'],['Quality checks','32','Automated or controlled'],['Open design decisions','6','Tracked to resolution']];
const health=[['Requirement coverage',94],['Model completeness',91],['Data quality',88],['Lineage coverage',93],['Test readiness',86]];
const quality=[['Customer',96,93,89,94],['Product',98,95,92,96],['Activity',91,88,84,90],['Reference',99,98,97,99]];
const scenarios=[['Base design','Current scale and daily refresh.','Proceed with governed dimensional model','Current volume and latency requirements support a structured reusable data product with explicit lineage and validation.'],['Volume growth','Threefold event volume.','Separate high-volume activity from conformed dimensions','Preserve stable business entities while scaling event processing independently.'],['Quality degradation','Key source completeness falls.','Introduce quality gating and fallback logic','Do not allow incomplete source loads to silently alter business measures.'],['Near-real-time','Latency target moves to minutes.','Split operational and analytical serving patterns','Protect governed analytical outputs while supporting a faster operational path where required.']];
function metricBars(){return `<div class="metric-stack">${health.map(x=>`<div class="metric-bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="metric-score">${x[1]}%</div></div>`).join('')}</div>`}
function head(i,tag){return `<div class="page-head"><div><h2 class="page-title">${views[i][1]}</h2><p class="page-desc">${views[i][2]}</p></div><span class="demo">${tag}</span></div>`}
function chart(){const vals=[78,86,74,92,82,88],targets=[92,94,90,96,91,93],labels=['Customer','Product','Activity','Finance','Reference','Ops'];return `<svg class="chart" viewBox="0 0 650 220">${[35,85,135,185].map(y=>`<line class="gridline" x1="40" y1="${y}" x2="625" y2="${y}"/>`).join('')}${vals.map((v,i)=>{let x=55+i*95,h=v*1.55,h2=targets[i]*1.55;return `<rect x="${x}" y="${190-h}" width="28" height="${h}" rx="3" fill="var(--blue)" opacity=".78"/><rect x="${x+32}" y="${190-h2}" width="28" height="${h2}" rx="3" fill="var(--gold)" opacity=".86"/><text class="tick" x="${x-2}" y="210">${labels[i]}</text>`}).join('')}</svg>`}
function flow(items){return `<div class="flow">${items.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div>`}
function overview(){return head(0,'Illustrative demonstration')+`<section class="grid kpis">${kpis.map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">${x[2]}</div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>Domain readiness</h3><p>Baseline versus target design coverage.</p></div></div>${chart()}</div><div class="card"><div class="chart-title"><div><h3>Design health</h3><p>Selected design and assurance indicators.</p></div></div>${metricBars()}</div></section><section class="grid two"><div class="decision"><div class="eyebrow">Design focus</div><h3>Make business meaning explicit before optimising implementation</h3><p>Start with the decision, grain, definitions and acceptance criteria. A scalable pipeline still fails if the measures it carries are ambiguous.</p></div><div class="card"><div class="chart-title"><div><h3>Decision register</h3><p>Current issues requiring design resolution.</p></div></div><div class="table-wrap"><table><thead><tr><th>Issue</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Customer key inconsistency</td><td>Identity mapping</td><td><span class="badge warn-b">Watch</span></td><td>Confirm canonical key</td></tr><tr><td>Late source arrival</td><td>Timeliness</td><td><span class="badge warn-b">Review</span></td><td>Define fallback rule</td></tr><tr><td>Metric overlap</td><td>Business logic</td><td><span class="badge good">On track</span></td><td>Complete playback</td></tr></tbody></table></div></div></section>`}
function design(){return head(1,'Solution view')+`<section class="card feature"><div class="chart-title"><div><h3>End-to-end solution pathway</h3><p>From business problem to governed data product.</p></div></div>${flow([['Business need','Outcome, decision, user and success measure.'],['Source interfaces','Systems, keys, grain, cadence and constraints.'],['Logical model','Entities, relationships, measures and rules.'],['Transformation','Cleansing, joins, derivations and controls.'],['Data product','Reusable model, semantic layer or governed dataset.'],['Consumer','Analytics, reporting, operations or downstream service.']])}</section><section class="grid two" style="margin-top:10px"><div class="card">${metricBars()}</div><div class="decision"><div class="eyebrow">Playback question</div><h3>Can a stakeholder explain what every key measure means and where it comes from?</h3><p>A design is complete when business meaning, technical structure, controls and acceptance criteria align.</p></div></section>`}
function assurance(){return head(2,'Assurance view')+`<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heatmap"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="heat-head">${x}</div>`).join('')}${quality.map(q=>`<div class="heat-label">${q[0]}</div>${q.slice(1).map(v=>`<div class="heat-cell ${v>=93?'hi':v>=87?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Root-cause pathway</h3><p>From anomaly to durable control.</p></div></div><div class="timeline">${[['Detect exception','Validation identifies an unexpected result.'],['Localise issue','Confirm source, key, transformation or rule layer.'],['Assess impact','Identify affected measures and consumers.'],['Resolve cause','Correct mapping, logic or source issue.'],['Prevent recurrence','Add validation, monitoring or documentation control.']].map((x,i)=>`<div class="tl ${i===2?'warn':''}"><span class="tl-dot"></span><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div></div></section>`}
function scenario(){let s=scenarios[state.scenario];return head(3,'Scenario view')+`<div class="scenarios">${scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?'active':''}" data-sc="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Design response</h3><p>How the target pattern changes under the selected condition.</p></div></div>${chart()}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s[2]}</h3><p>${s[3]}</p></div></section>`}
function governance(){return head(4,'Governance view')+`<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Measure lineage</h3><p>Trace business output back to controlled source.</p></div></div>${flow([['Business outcome','Decision the product must support.'],['Metric','Definition, grain and acceptance criteria.'],['Model','Entity and dimensional structures.'],['Transformation','Rules, joins and calculations.'],['Source','Authoritative systems and interfaces.'],['Control','Validation and reconciliation evidence.']])}</div><div class="card"><div class="chart-title"><div><h3>Design rhythm</h3><p>Lightweight review controls through delivery.</p></div></div><div class="timeline">${[['Discovery','Clarify users, decisions, constraints and source landscape.'],['Design playback','Review model, definitions and trade-offs.'],['Assurance gate','Resolve material quality and lineage exceptions.'],['Build handoff','Provide build-ready design and acceptance criteria.'],['Post-build validation','Reconcile outputs and confirm intended behaviour.']].map((x,i)=>`<div class="tl ${i===2?'warn':''}"><span class="tl-dot"></span><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div></div></section>`}
const renders=[overview,design,assurance,scenario,governance];
function renderSidebar(){let s=document.getElementById('sidebar');s.innerHTML=`<div class="side-title">Portfolio views</div>${views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-view="${i}"><span class="nav-num">0${i+1}</span><span class="nav-label">${v[0]}</span></button>`).join('')}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Role-relevant data solution design demonstration</div>`;s.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}
function render(){document.getElementById('main').innerHTML=renders[state.view]();renderSidebar();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.scenario=+b.dataset.sc;render()})}
document.getElementById('themeBtn').onclick=()=>{let dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';document.getElementById('themeBtn').textContent=dark?'Dark mode':'Light mode'};render();
</script>
</body></html>
