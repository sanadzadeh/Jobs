<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaled S. - Investment Research & Portfolio Oversight</title><style>:root{--bg:#f3f5f6;--s:#fff;--s2:#f7f9fa;--line:#d8e0e5;--ink:#18232c;--m:#60707b;--a:#0b5d6b;--ad:#e4f1f2;--b:#4a7897;--ok:#3f7a4c;--w:#a3720a;--r:#a23b2e;--sh:0 7px 22px rgba(34,48,58,.08)}:root[data-theme=dark]{--bg:#11171c;--s:#182027;--s2:#1e2830;--line:#2f3b44;--ink:#edf2f4;--m:#aab5be;--a:#61c5bf;--ad:#173335;--b:#7ba9c8;--ok:#7fc98f;--w:#e0ad4c;--r:#e08a7a;--sh:0 9px 26px rgba(0,0,0,.27)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.h{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:11px 20px;background:var(--s);border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center}.mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--a),var(--b))}.brand h1{font:600 18px Georgia;margin:0}.brand p{margin:4px 0 0;font:10px monospace;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.theme{border:1px solid var(--line);background:var(--s2);color:var(--ink);border-radius:7px;padding:6px 9px}.app{display:grid;grid-template-columns:210px 1fr}.side{position:sticky;top:57px;height:calc(100vh - 57px);background:var(--s);border-right:1px solid var(--line);padding:14px 9px}.nav{width:100%;border:0;border-left:3px solid transparent;background:transparent;color:var(--m);padding:9px;text-align:left;border-radius:7px;margin:2px 0}.nav.active{background:var(--ad);border-left-color:var(--a);color:var(--a)}.main{padding:20px 24px 40px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.head h2{font:600 24px Georgia;margin:0 0 5px}.head p{margin:0;color:var(--m);font-size:12px;max-width:800px}.demo{font:10px monospace;color:var(--a);background:var(--ad);padding:5px 7px;border-radius:20px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--s);border:1px solid var(--line);border-radius:11px;padding:13px;box-shadow:0 2px 8px rgba(34,48,58,.06)}.card.feature{box-shadow:var(--sh)}.ey{font:10px monospace;text-transform:uppercase;color:var(--m);margin-bottom:6px}.val{font:600 25px Georgia}.sub{font-size:11px;color:var(--m);margin-top:5px}.bars{display:grid;gap:9px}.br{display:grid;grid-template-columns:130px 1fr 42px;gap:8px;align-items:center}.br label{font-size:11px;color:var(--m)}.track{height:7px;background:var(--s2);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--b))}.score{font:10px monospace;color:var(--m);text-align:right}.flow{display:flex;gap:6px;overflow:auto}.node{min-width:155px;flex:1;padding:10px;background:var(--s2);border:1px solid var(--line);border-radius:8px}.node:first-child{background:var(--ad);border-color:var(--a)}.node b{display:block;font:10px monospace;text-transform:uppercase;color:var(--m);margin-bottom:5px}.node span{font-size:11px;line-height:1.4;color:var(--m)}.arrow{align-self:center;color:var(--m)}.decision{border-left:4px solid var(--a);background:var(--s);border-radius:11px;padding:13px}.decision h3{font:600 17px Georgia;margin:0 0 6px}.decision p{font-size:11px;color:var(--m);line-height:1.5;margin:0}.sc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.sc button{border:1px solid var(--line);background:var(--s2);color:var(--m);border-radius:7px;padding:9px;text-align:left}.sc button.active{background:var(--ad);border-color:var(--a);color:var(--a)}table{width:100%;border-collapse:collapse;background:var(--s)}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}th{font:10px monospace;text-transform:uppercase;color:var(--m);background:var(--s2)}.badge{padding:3px 6px;border-radius:20px;font-weight:700}.good{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.warn{color:var(--w);background:color-mix(in srgb,var(--w) 12%,transparent)}.risk{color:var(--r);background:color-mix(in srgb,var(--r) 12%,transparent)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto}.nav{white-space:nowrap}.kpis,.two,.sc{grid-template-columns:1fr}.main{padding:16px 12px}.h{position:static}}</style></head><body><header class="h"><div class="brand"><div class="mk"></div><div><h1>Khaled S. - Investment Research & Portfolio Oversight</h1><p>manager research · performance · risk · due diligence · decision support</p></div></div><button class="theme" id="theme">Dark mode</button></header><div class="app"><nav class="side" id="side"></nav><main class="main" id="main"></main></div><script>
const V=[["Executive overview","Equity portfolio overview","Performance, manager signals, risk and current decision priorities."],["Manager research","Manager research workflow","A structured path from universe screening to recommendation and monitoring."],["Portfolio assurance","Portfolio assurance","Quantitative and qualitative checks across performance, risk, ESG and mandate adherence."],["Scenarios","Portfolio scenarios","How market and manager conditions change the analytical recommendation."],["Governance","Governance & reporting","Decision papers, monitoring evidence, review points and action tracking."]],K=[["Managers monitored","14","Illustrative active watchlist"],["3Y excess return","2.4%","Versus benchmark"],["Tracking error","4.8%","Portfolio-level indicator"],["Open actions","5","Research and monitoring items"]],B=[["Performance evidence",94],["Portfolio fit",91],["Risk transparency",88],["Process confidence",92],["Reporting readiness",90]],F=[[["Screen","Define universe, mandate fit and filters."],["Research","Assess people, process, philosophy and performance."],["Model","Test risk, style and portfolio fit."],["Challenge","Document assumptions and alternatives."],["Recommend","Prepare decision paper and implementation view."]],[["Monitor","Track mandate, performance and exposures."],["Diagnose","Separate market, style and manager effects."],["Escalate","Flag drift or control issues."],["Action","Rebalance, review or retain."],["Evidence","Document rationale and follow-up."]]],S=[["Base case","Stable markets and manager behaviour.","Maintain disciplined monitoring","Current evidence supports continued monitoring with attention on style consistency and portfolio fit."],["Style drift","Factor exposures move materially.","Re-test mandate fit","Separate intended positioning from structural drift before changing allocation."],["Drawdown","Relative performance weakens sharply.","Diagnose before acting","Assess market regime, process adherence and downside capture rather than reacting to headline returns alone."],["Transition","Manager change or rebalance required.","Plan implementation carefully","Balance expected benefit against transaction cost, timing and operational risk."]],R=[["Manager A","Persistent alpha, stable process","Proceed","Advance to final due diligence"],["Manager B","Style drift emerging","Review","Test exposures and mandate fit"],["Manager C","Weak downside capture","Watch","Increase monitoring frequency"],["Manager D","ESG data gap","Review","Resolve evidence before recommendation"]];let st={v:0,s:0};
function head(){return '<div class="head"><div><h2>'+V[st.v][1]+'</h2><p>'+V[st.v][2]+'</p></div><span class="demo">Illustrative demonstration</span></div>'}
function bars(){return '<div class="bars">'+B.map(x=>'<div class="br"><label>'+x[0]+'</label><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><div class="score">'+x[1]+'%</div></div>').join('')+'</div>'}
function flow(a){return '<div class="flow">'+a.map((x,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="node"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>'}
function badge(s){let c=/proceed|strong|on track|controlled/i.test(s)?'good':/review|watch|refine/i.test(s)?'warn':'risk';return '<span class="badge '+c+'">'+s+'</span>'}
function view0(){return head()+'<div class="grid kpis">'+K.map(x=>'<div class="card"><div class="ey">'+x[0]+'</div><div class="val">'+x[1]+'</div><div class="sub">'+x[2]+'</div></div>').join('')+'</div><div class="grid two"><div class="card feature">'+bars()+'</div><div class="decision"><div class="ey">Decision focus</div><h3>'+S[0][2]+'</h3><p>'+S[0][3]+'</p></div></div>'}
function view1(){return head()+'<div class="card">'+flow(F[0])+'</div>'}
function view2(){return head()+'<div class="grid two"><div class="card">'+bars()+'</div><div class="card">'+flow(F[1])+'</div></div>'}
function view3(){let x=S[st.s];return head()+'<div class="sc">'+S.map((y,i)=>'<button class="'+(i===st.s?'active':'')+'" data-s="'+i+'"><strong>'+y[0]+'</strong><br><small>'+y[1]+'</small></button>').join('')+'</div><div class="grid two"><div class="card feature">'+bars()+'</div><div class="decision"><div class="ey">Scenario implication</div><h3>'+x[2]+'</h3><p>'+x[3]+'</p></div></div>'}
function view4(){return head()+'<div class="card"><table><thead><tr><th>Item</th><th>Signal</th><th>Status</th><th>Next action</th></tr></thead><tbody>'+R.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+badge(r[2])+'</td><td>'+r[3]+'</td></tr>').join('')+'</tbody></table></div>'}
const RR=[view0,view1,view2,view3,view4];function render(){main.innerHTML=RR[st.v]();side.innerHTML=V.map((x,i)=>'<button class="nav '+(i===st.v?'active':'')+'" data-v="'+i+'">0'+(i+1)+'  '+x[0]+'</button>').join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{st.v=+b.dataset.v;render()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st.s=+b.dataset.s;render()})}theme.onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';theme.textContent=d?'Dark mode':'Light mode'};render();
</script></body></html>
