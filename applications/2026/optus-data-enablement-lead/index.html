<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Data Enablement & Governance Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative data enablement portfolio covering trusted data, governance, quality, single sources of truth, analytics and remediation.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;--border:#d8e0e5;--ink:#18232c;--ink2:#55636f;--ink3:#7b8893;--accent:#0b5d6b;--accent-dim:#e4f1f2;--blue:#4a7897;--gold:#b58b48;--ok:#3f7a4c;--okdim:#e8f3eb;--warn:#a3720a;--warndim:#fbf1dc;--risk:#a23b2e;--riskdim:#f8e8e5;--shadow:0 7px 22px rgba(34,48,58,.08);--radius:11px;--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
:root[data-theme="dark"]{--paper:#11171c;--surface:#182027;--surface-alt:#1e2830;--surface-deep:#25313a;--border:#2f3b44;--ink:#edf2f4;--ink2:#aab5be;--ink3:#81909b;--accent:#61c5bf;--accent-dim:#173335;--blue:#7ba9c8;--gold:#c9a86d;--ok:#7fc98f;--okdim:#193425;--warn:#e0ad4c;--warndim:#3a2e15;--risk:#e08a7a;--riskdim:#3c201d;--shadow:0 9px 26px rgba(0,0,0,.27)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}button{font:inherit;cursor:pointer}.shell{min-height:100vh}.header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative}.mark:before,.mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.mark:before{top:11px}.mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.theme{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:.64rem}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}.side-title{font:400 .5rem var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:400 .53rem var(--mono);color:var(--ink3)}.nav-label{font-size:.71rem;font-weight:600}.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink2)}.main{padding:20px 24px 44px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.page-title{font:600 1.4rem var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:850px;color:var(--ink2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem var(--mono);text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--border);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(34,48,58,.06);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}.eyebrow{font:500 .49rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.value{font:600 1.35rem var(--serif)}.sub{font-size:.59rem;color:var(--ink2);line-height:1.35;margin-top:5px}.chart-title h3{font-size:.76rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink3);margin:3px 0 8px}.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:128px 1fr 42px;gap:8px;align-items:center}.barrow label{font-size:.59rem;color:var(--ink2)}.track{height:7px;background:var(--surface-deep);border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:999px}.score{text-align:right;font:400 .55rem var(--mono);color:var(--ink2)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:155px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}.node .nt{font:400 .48rem var(--mono);text-transform:uppercase;color:var(--ink3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink2)}.arrow{align-self:center;color:var(--ink3)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px}.decision h3{font:600 .94rem var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink2);margin:0}.heatmap{display:grid;grid-template-columns:145px repeat(4,1fr);gap:6px;align-items:center}.hh{font:400 .48rem var(--mono);text-transform:uppercase;color:var(--ink3);text-align:center}.hl{font-size:.59rem;color:var(--ink2)}.hc{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:.59rem}th{font:400 .47rem var(--mono);text-transform:uppercase;color:var(--ink3);background:var(--surface-alt)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.good{color:var(--ok);background:var(--okdim)}.warn{color:var(--warn);background:var(--warndim)}.risk{color:var(--risk);background:var(--riskdim)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink2);border-radius:7px;padding:9px;text-align:left;font-size:.58rem}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink3);font-size:.51rem;line-height:1.3}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;color:var(--ink2);line-height:1.4}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.scenarios{grid-template-columns:1fr}.main{padding:16px 12px 36px}.header{position:static}}
</style>
</head>
<body>
<div class="shell"><header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. - Data Enablement & Governance Portfolio</h1><p>trusted data · quality · controls · analytics · decision support</p></div></div><button class="theme" id="theme">Dark mode</button></header><div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div></div>
<script>
const views=[['Executive overview','Trusted data overview','A decision-oriented view of data accessibility, quality, control effectiveness and analytical readiness.'],['Single source of truth','Single source of truth','How fragmented sources are aligned into governed measures, consistent definitions and reusable reporting.'],['Data assurance','Data quality & remediation','Quality controls, issue triage, anomaly investigation and remediation pathways.'],['Enablement scenarios','Enablement scenarios','Alternative operating conditions for scale, quality, access and reporting demand.'],['Governance','Governance & lineage','Traceability from business outcome to measure, transformation, source and control evidence.']];let state={view:0,scenario:0};
const kpis=[['Trusted measures','42','Defined and traceable'],['Quality controls','36','Automated or governed'],['Source domains','8','Aligned to common definitions'],['Open remediation items','7','Tracked to closure']];const bars=[['Measure consistency',94],['Data completeness',91],['Lineage coverage',88],['Control effectiveness',92],['Self-service readiness',86]];const q=[['Customer',97,94,91,95],['Billing',93,90,88,92],['Collections',91,89,84,90],['Reference',99,98,97,99]];const scenarios=[['Base','Current demand and daily refresh.','Maintain governed enablement model','Current operating conditions support a controlled single-source approach with explicit validation and reusable reporting.'],['Access growth','More self-service users and datasets.','Strengthen access patterns and certified datasets','Scale access through controlled semantic layers and clear ownership rather than duplicating local extracts.'],['Quality incident','Key source completeness deteriorates.','Gate affected measures and accelerate remediation','Protect downstream decisions by isolating impacted outputs, documenting the issue and restoring trusted data before release.'],['Reporting surge','Decision demand increases materially.','Prioritise reusable models over one-off outputs','Use governed common measures and modular analytical assets to absorb demand without weakening controls.']];
function head(i,tag){return `<div class="page-head"><div><h2 class="page-title">${views[i][1]}</h2><p class="page-desc">${views[i][2]}</p></div><span class="demo">${tag}</span></div>`}function metricBars(items=bars){return `<div class="bars">${items.map(x=>`<div class="barrow"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}function flow(items){return `<div class="flow">${items.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div>`}function badge(s){let c=/on track|controlled|certified/i.test(s)?'good':/watch|remediate/i.test(s)?'warn':'risk';return `<span class="badge ${c}">${s}</span>`}
function overview(){return head(0,'Illustrative demonstration')+`<section class="grid kpis">${kpis.map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><h3>Enablement health</h3><p>Selected indicators across trust, governance and usability.</p></div>${metricBars()}</div><div class="decision"><div class="eyebrow">Decision focus</div><h3>Scale access through governed, reusable data products</h3><p>Prioritise certified measures, clear source ownership and automated checks so broader access improves decision speed without weakening control.</p></div></section><section class="card"><div class="chart-title"><h3>Current action register</h3><p>Illustrative priorities requiring confirmation or closure.</p></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Domain</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Duplicate KPI definition</td><td>Performance</td><td>${badge('Remediate')}</td><td>Consolidate to certified measure</td></tr><tr><td>Unmapped source field</td><td>Billing</td><td>${badge('Watch')}</td><td>Complete lineage</td></tr><tr><td>Manual extract dependency</td><td>Collections</td><td>${badge('Remediate')}</td><td>Automate controlled refresh</td></tr><tr><td>Access review</td><td>Shared reporting</td><td>${badge('On track')}</td><td>Maintain evidence</td></tr></tbody></table></div></section>`}
function ssot(){return head(1,'Design view')+`<section class="card" style="margin-bottom:10px"><div class="chart-title"><h3>Single-source design pathway</h3><p>From fragmented inputs to reusable decision products.</p></div>${flow([['Business question','Define outcome, users and decision need.'],['Source alignment','Map systems, fields, definitions and owners.'],['Transformation','Standardise rules, joins and derived measures.'],['Certified model','Publish governed semantic or analytical layer.'],['Consumption','Dashboards, analysis and self-service reporting.']])}</section><section class="grid two"><div class="card"><div class="chart-title"><h3>Design principles</h3><p>Controls built into the solution rather than added later.</p></div>${metricBars([['Definition reuse',96],['Source traceability',93],['Automated validation',89],['Documentation',91],['Change control',87]])}</div><div class="decision"><div class="eyebrow">Enablement principle</div><h3>One governed definition, many uses</h3><p>Common measures and documented transformations reduce reconciliation effort, improve trust and make self-service analytics safer to scale.</p></div></section>`}
function assurance(){return head(2,'Assurance view')+`<section class="grid two"><div class="card"><div class="chart-title"><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div><div class="heatmap"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="hh">${x}</div>`).join('')}${q.map(r=>`<div class="hl">${r[0]}</div>${r.slice(1).map(v=>`<div class="hc ${v>=94?'hi':v>=88?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="chart-title"><h3>Remediation pathway</h3><p>How issues move from detection to controlled closure.</p></div>${flow([['Detect','Automated checks or stakeholder exception.'],['Assess','Confirm scope, impact and affected measures.'],['Contain','Gate or flag downstream use where required.'],['Remediate','Correct source, rule or process defect.'],['Validate','Reconcile, evidence and close.']])}</div></section>`}
function scen(){const s=scenarios[state.scenario];return head(3,'Scenario view')+`<div class="scenarios">${scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?'active':''}" data-sc="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><section class="grid two"><div class="card feature"><div class="chart-title"><h3>Scenario readiness</h3><p>Illustrative control and enablement capacity.</p></div>${metricBars(state.scenario===0?bars:state.scenario===1?[['Access controls',91],['Certified data',90],['Documentation',88],['User enablement',92],['Monitoring',87]]:state.scenario===2?[['Issue detection',95],['Containment',93],['Root-cause analysis',89],['Remediation speed',82],['Validation',91]]:[['Reusable models',94],['Automation',90],['Prioritisation',88],['Quality controls',91],['Stakeholder clarity',86]])}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s[2]}</h3><p>${s[3]}</p></div></section>`}
function gov(){return head(4,'Governance view')+`<section class="grid two" style="margin-bottom:10px"><div class="card"><div class="chart-title"><h3>Measure lineage</h3><p>Trace decision outputs back to source and evidence.</p></div>${flow([['Business outcome','Operational performance or customer outcome.'],['Measure','Certified KPI and definition.'],['Model','Transformation and calculation logic.'],['Source','Controlled system or approved dataset.'],['Evidence','Validation, owner and change history.']])}</div><div class="card"><div class="chart-title"><h3>Governance rhythm</h3><p>Illustrative control cadence.</p></div><div class="timeline"><div class="tl"><span class="dot"></span><strong>Daily quality monitoring</strong><p>Material exceptions and source failures.</p></div><div class="tl"><span class="dot"></span><strong>Weekly remediation review</strong><p>Issue ownership, impact and closure evidence.</p></div><div class="tl"><span class="dot"></span><strong>Monthly measure review</strong><p>Definitions, usage and change impacts.</p></div><div class="tl"><span class="dot"></span><strong>Quarterly access review</strong><p>Permissions, ownership and control evidence.</p></div></div></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Control</th><th>Purpose</th><th>Evidence</th><th>Status</th></tr></thead><tbody><tr><td>Measure certification</td><td>Consistent KPI definitions</td><td>Definition register</td><td>${badge('Controlled')}</td></tr><tr><td>Source reconciliation</td><td>Detect material variance</td><td>Validation results</td><td>${badge('Controlled')}</td></tr><tr><td>Issue remediation</td><td>Resolve known defects</td><td>Action register</td><td>${badge('Watch')}</td></tr><tr><td>Access governance</td><td>Secure appropriate use</td><td>Access review</td><td>${badge('Controlled')}</td></tr></tbody></table></div></section>`}
const renders=[overview,ssot,assurance,scen,gov];function renderSidebar(){const s=document.getElementById('sidebar');s.innerHTML=`<div class="side-title">Portfolio views</div>${views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-view="${i}"><span class="nav-num">0${i+1}</span><span class="nav-label">${v[0]}</span></button>`).join('')}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Designed for role-relevant decision support</div>`;s.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}function render(){document.getElementById('main').innerHTML=renders[state.view]();renderSidebar();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.scenario=+b.dataset.sc;render()})}document.getElementById('theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';document.getElementById('theme').textContent=d?'Dark mode':'Light mode'};render();
</script>
</body></html>
