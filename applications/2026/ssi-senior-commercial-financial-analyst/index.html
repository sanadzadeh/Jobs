<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commercial Finance & Program Sustainability Portfolio</title><style>
:root{--paper:#f3f5f6;--surface:#fff;--surface2:#f7f9fa;--border:#d8e0e5;--ink:#18232c;--muted:#64727d;--accent:#0b5d6b;--accent2:#4a7897;--accentdim:#e4f1f2;--ok:#3f7a4c;--warn:#a3720a;--risk:#a23b2e;--shadow:0 7px 22px rgba(34,48,58,.08);--serif:Georgia,serif;--mono:'Courier New',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand h1{font:600 1.15rem var(--serif);margin:0}.brand p{font:.52rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}.theme{border:1px solid var(--border);background:var(--surface2);padding:7px 10px;border-radius:7px}.app{display:grid;grid-template-columns:215px 1fr}.side{position:sticky;top:58px;height:calc(100vh - 58px);background:var(--surface);border-right:1px solid var(--border);padding:14px 10px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-left:3px solid transparent;border-radius:7px;margin:2px 0;color:var(--muted);font-weight:600}.nav.active{background:var(--accentdim);border-left-color:var(--accent);color:var(--accent)}.meta{font:.57rem/1.5 var(--mono);color:var(--muted);border-top:1px solid var(--border);margin-top:18px;padding:12px 8px}.main{padding:20px 24px 40px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:14px}.head h2{font:600 1.45rem var(--serif);margin:0 0 5px}.head p{font-size:.7rem;color:var(--muted);margin:0;max-width:850px}.pill{font:.5rem var(--mono);text-transform:uppercase;background:var(--accentdim);color:var(--accent);padding:5px 8px;border-radius:99px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px;box-shadow:0 2px 8px rgba(34,48,58,.05)}.eyebrow{font:.49rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.value{font:600 1.38rem var(--serif)}.sub{font-size:.58rem;color:var(--muted);margin-top:4px}.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:125px 1fr 42px;gap:8px;align-items:center}.bar span:first-child{font-size:.59rem;color:var(--muted)}.track{height:7px;background:#e9eef1;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.score{font:.55rem var(--mono);text-align:right;color:var(--muted)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:150px;flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px}.node strong{font:.51rem var(--mono);text-transform:uppercase;color:var(--muted)}.node p{font-size:.58rem;line-height:1.4;color:var(--muted);margin:5px 0 0}.arrow{align-self:center;color:var(--muted)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface2));border-radius:11px;padding:13px}.decision h3{font:600 .95rem var(--serif);margin:0 0 5px}.decision p{font-size:.6rem;line-height:1.5;color:var(--muted);margin:0}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:720px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:.59rem}th{font:.47rem var(--mono);text-transform:uppercase;color:var(--muted);background:var(--surface2)}.badge{padding:3px 6px;border-radius:99px;font-size:.55rem;font-weight:700}.good{background:#e8f3eb;color:var(--ok)}.warn{background:#fbf1dc;color:var(--warn)}.risk{background:#f8e8e5;color:var(--risk)}.scens{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.sc{border:1px solid var(--border);background:var(--surface2);border-radius:7px;padding:9px;text-align:left;font-size:.58rem;color:var(--muted)}.sc.active{background:var(--accentdim);border-color:var(--accent);color:var(--accent)}.sc strong{display:block}.sc span{display:block;font-size:.51rem;margin-top:3px}.waterfall{display:grid;gap:8px}.wf{display:grid;grid-template-columns:150px 1fr 55px;gap:8px;align-items:center}.wf label{font-size:.59rem;color:var(--muted)}.wf .box{height:24px;background:var(--accentdim);border-left:4px solid var(--accent);border-radius:4px;position:relative}.wf .box.neg{background:#f8e8e5;border-left-color:var(--risk)}.wf b{font:.56rem var(--mono);text-align:right}.note{font-size:.56rem;color:var(--muted);margin-top:8px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.meta{display:none}.nav{white-space:nowrap;width:auto}.kpis,.two,.scens{grid-template-columns:1fr}.main{padding:16px 12px 30px}.header{position:static}}
</style></head><body><header class="header"><div class="brand"><h1>Khaled S. - Commercial Finance & Program Sustainability</h1><p>forecasting · scenario modelling · performance · sustainability · decision support</p></div><button class="theme" id="theme">Dark mode</button></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><script>
const views=[['Executive overview','Program portfolio overview','A forward-looking view of revenue, cost, workforce, sustainability and current decision priorities.'],['Planning & forecast','Planning and rolling forecast','A structured approach to budget assumptions, rolling forecasts and scenario-led planning.'],['Program economics','Program economics','Revenue, workforce, overhead and service-delivery drivers translated into program sustainability.'],['Scenarios','Strategic scenarios','Decision impacts under funding, workforce, demand and service-model changes.'],['Governance','Management reporting & governance','Controls, assumptions, decision papers and review rhythm supporting reliable commercial advice.']];let state={v:0,s:0};const scens=[['Base','Current funding and service model.','Maintain disciplined rolling forecast','Current settings support a stable outlook if workforce and delivery assumptions remain within tolerance.'],['Funding pressure','Revenue or grant funding reduces.','Re-test sustainability and cost base','Separate fixed and variable cost drivers, test service-volume implications and identify options before committing to cuts.'],['Workforce growth','Demand requires higher staffing.','Model workforce cost and productivity','Link headcount, utilisation and service-volume assumptions to revenue and margin before approving growth.'],['Service redesign','Delivery model changes materially.','Compare transition and steady-state economics','Show transition cost, implementation timing, productivity effects and the point at which the new model improves sustainability.']];
function head(i){return `<div class="head"><div><h2>${views[i][1]}</h2><p>${views[i][2]}</p></div><span class="pill">Illustrative data only</span></div>`}function bars(){let a=[['Forecast confidence',92],['Revenue visibility',89],['Workforce model',94],['Cost allocation',87],['Decision readiness',91]];return `<div class="bars">${a.map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}function flow(a){return `<div class="flow">${a.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div>`}function overview(){return head(0)+`<div class="grid kpis"><div class="card"><div class="eyebrow">Annual revenue</div><div class="value">$128m</div><div class="sub">Illustrative program portfolio</div></div><div class="card"><div class="eyebrow">Forecast variance</div><div class="value">1.8%</div><div class="sub">Against current plan</div></div><div class="card"><div class="eyebrow">Workforce cost</div><div class="value">61%</div><div class="sub">Share of program cost</div></div><div class="card"><div class="eyebrow">Open decisions</div><div class="value">6</div><div class="sub">Growth / redesign / funding</div></div></div><div class="grid two"><div class="card">${bars()}</div><div class="decision"><div class="eyebrow">Commercial focus</div><h3>Link operational drivers to financial sustainability</h3><p>Use rolling forecasts, workforce drivers and scenario analysis to show how service-volume, funding and cost assumptions change program viability and the timing of intervention.</p></div></div>`}function planning(){return head(1)+`<div class="card" style="margin-bottom:10px">${flow([['Assumptions','Funding, service volume, workforce, inflation and timing.'],['Driver model','Connect operational drivers to revenue and cost.'],['Forecast','Refresh monthly outlook and variance drivers.'],['Challenge','Test sensitivities and management assumptions.'],['Decision','Translate options into executive recommendations.']])}</div><div class="grid two"><div class="card">${bars()}</div><div class="decision"><div class="eyebrow">Planning principle</div><h3>Forecast the drivers, not only the ledger</h3><p>Driver-based planning makes material assumptions visible and allows leaders to understand what would need to change for a program to remain sustainable.</p></div></div>`}function economics(){return head(2)+`<div class="grid two"><div class="card"><div class="waterfall"><div class="wf"><label>Program revenue</label><div class="box" style="width:95%"></div><b>$42.0m</b></div><div class="wf"><label>Direct workforce</label><div class="box neg" style="width:62%"></div><b>-$26.1m</b></div><div class="wf"><label>Service delivery</label><div class="box neg" style="width:19%"></div><b>-$8.0m</b></div><div class="wf"><label>Allocated overhead</label><div class="box neg" style="width:12%"></div><b>-$5.1m</b></div><div class="wf"><label>Contribution</label><div class="box" style="width:7%"></div><b>$2.8m</b></div></div><div class="note">Illustrative program economics, designed to show decision logic rather than actual organisational data.</div></div><div class="card">${flow([['Revenue','Funding, contracts and activity drivers.'],['Workforce','FTE, vacancy, mix and utilisation.'],['Service cost','Volume, location and delivery model.'],['Overheads','Allocation method and fixed-cost exposure.'],['Sustainability','Margin, risk and required action.']])}</div></div>`}function scenarios(){let s=scens[state.s];return head(3)+`<div class="scens">${scens.map((x,i)=>`<button class="sc ${i===state.s?'active':''}" data-s="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><div class="grid two"><div class="card">${bars()}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s[2]}</h3><p>${s[3]}</p></div></div>`}function gov(){return head(4)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Item</th><th>Evidence</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Revenue assumption</td><td>Contract + activity forecast</td><td><span class="badge good">Controlled</span></td><td>Refresh monthly</td></tr><tr><td>Workforce utilisation</td><td>Roster / FTE / service volume</td><td><span class="badge warn">Review</span></td><td>Test productivity assumption</td></tr><tr><td>Overhead allocation</td><td>Current allocation basis</td><td><span class="badge warn">Review</span></td><td>Validate methodology</td></tr><tr><td>Program redesign</td><td>Transition and steady-state model</td><td><span class="badge good">On track</span></td><td>Prepare executive options paper</td></tr></tbody></table></div></div>`}const R=[overview,planning,economics,scenarios,gov];function render(){document.getElementById('main').innerHTML=R[state.v]();document.getElementById('side').innerHTML=views.map((x,i)=>`<button class="nav ${i===state.v?'active':''}" data-v="${i}">${x[0]}</button>`).join('')+`<div class="meta">Organisation-neutral portfolio artefact<br>Illustrative financial data only<br>Role-relevant commercial analysis demonstration</div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{state.v=+b.dataset.v;render()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state.s=+b.dataset.s;render()})}document.getElementById('theme').onclick=()=>{document.body.style.filter=document.body.style.filter?'':'invert(.9) hue-rotate(180deg)'};render();
</script></body></html>
