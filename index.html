<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f7">
<title>Jobs</title>
<meta name="description" content="Personal job application tracker with CV and cover-letter review tools.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=20260920-1">
<link rel="stylesheet" href="./documents.css?v=20260920-1">
<link rel="stylesheet" href="./landing.css?v=20260920-1">
</head>
<body>
<section class="landing" id="landing" aria-labelledby="landingTitle">
  <main class="landing-main">
    <h1 id="landingTitle">Job tracker</h1>
    <p>Load the latest Excel register. Refreshing the page clears the current session and requires the workbook to be loaded again.</p>
    <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Load Excel job application register">
      <strong>Drop Excel file here</strong>
      <span>or</span>
      <label class="upload-button" for="landingFileInput">Choose file</label>
      <input id="landingFileInput" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    </div>
    <div class="upload-status" id="uploadStatus" aria-live="polite"></div>
  </main>
</section>

<div class="shell is-hidden" id="dashboardShell">
  <header class="header">
    <div class="brand"><div><h1>Job tracker</h1><p>Applications · deadlines · documents · outcomes</p></div></div>
    <div class="header-actions">
      <span class="source-pill" id="sourcePill"><i></i><span id="sourceLabel">No workbook loaded</span></span>
      <label class="btn soft" for="fileInput">Replace workbook</label>
      <input id="fileInput" type="file" accept=".xlsx,.xls" hidden>
      <button class="btn" id="themeBtn" type="button">Dark mode</button>
    </div>
  </header>
  <div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main></div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer"><div class="drawer-head"><div><h2 id="drawerTitle"></h2><p id="drawerSub"></p></div><button class="btn" id="drawerClose" type="button">Close</button></div><div class="drawer-body" id="drawerBody"></div></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>try{localStorage.removeItem('jobDashRegisterCache')}catch(e){}</script>
<script src="./documents-data.js?v=20260920-8"></script>
<script src="./core.js?v=20260920-7"></script>
<script src="./xlsx-loader.js?v=20260920-2"></script>
<script src="./views.js?v=20260920-6"></script>
<script src="./offline.js?v=20260921-2"></script>
<script src="./overview-merge.js?v=20260920-6"></script>
<script src="./weekly-axis.js?v=20260921-1"></script>
<script src="./actions.js?v=20260921-1"></script>
</body>
</html>
